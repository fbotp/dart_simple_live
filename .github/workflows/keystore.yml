name: gen-keystore

on:
  workflow_dispatch:
    inputs:
      alias:
        description: "keystore 别名 (KEY_ALIAS)"
        required: true
        default: "simplelive"
      password:
        description: "密码 (STORE_PASSWORD / KEY_PASSWORD)"
        required: true
        default: "simplelive123"

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Generate keystore & print secrets
        run: |
          ALIAS="${{ github.event.inputs.alias }}"
          PASS="${{ github.event.inputs.password }}"

          keytool -genkeypair -v \
            -keystore keystore.jks \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$PASS" \
            -keypass  "$PASS" \
            -dname "CN=SimpleLive, OU=Dev, O=SimpleLive, L=City, ST=State, C=CN"

          BASE64_CONTENT=$(base64 -w 0 keystore.jks)

          # 写入 GitHub 步骤摘要，方便直接复制
          {
            echo "## 🔐 Keystore Secrets 生成完成"
            echo ""
            echo "把下面 4 个值分别填到仓库 **Settings → Secrets and variables → Actions** 里。"
            echo ""
            echo "### 1. KEYSTORE_BASE64"
            echo '```'
            echo "$BASE64_CONTENT"
            echo '```'
            echo ""
            echo "### 2. STORE_PASSWORD"
            echo '```'
            echo "$PASS"
            echo '```'
            echo ""
            echo "### 3. KEY_PASSWORD"
            echo '```'
            echo "$PASS"
            echo '```'
            echo ""
            echo "### 4. KEY_ALIAS"
            echo '```'
            echo "$ALIAS"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

          # 同时在日志里也打印一份
          echo "================= 复制以下内容 ================="
          echo "KEYSTORE_BASE64:"
          echo "$BASE64_CONTENT"
          echo ""
          echo "STORE_PASSWORD = $PASS"
          echo "KEY_PASSWORD   = $PASS"
          echo "KEY_ALIAS      = $ALIAS"
          echo "================================================"

      - name: Upload keystore file (备份用)
        uses: actions/upload-artifact@v4
        with:
          name: keystore-backup
          path: keystore.jks
          retention-days: 7
